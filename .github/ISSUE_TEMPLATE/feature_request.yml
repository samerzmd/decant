name: Idea or feature request
description: Suggest something new for Decant, or a change to how it plays.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Decant aims to stay calm and uncluttered: *Pour. Sort. Unwind.* Ideas
        that keep it that way are the easiest to say yes to. Check the
        [roadmap](https://github.com/samerzmd/decant/blob/master/ROADMAP.md)
        first in case it's already planned.
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you like, and what would it be like to use?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What problem does it solve, or what would it make better?
    validations:
      required: true
  - type: dropdown
    id: help
    attributes:
      label: Would you like to build it?
      options:
        - I'd like to try building it
        - I could help test it
        - Just suggesting
